<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Redline HQ">
<meta name="theme-color" content="#08090A">
<title>Redline HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<style>
  :root{
    --bg:#08090A; --elev:#111214; --elev2:#181A1D; --sunk:#050506;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.15);
    --text:#F5F4F2; --dim:#8C9094; --faint:#7E8388;
    --red:#E8302A; --red-deep:#C72019; --red-soft:rgba(232,48,42,.1); --red-line:rgba(232,48,42,.28);
    --tab:calc(58px + env(safe-area-inset-bottom,0px));
    --top:calc(env(safe-area-inset-top,0px) + 58px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
  .hidden{display:none!important}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
  button{font-family:inherit;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--text)}

  .hdr{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:760px;z-index:20;background:var(--bg);gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .brand-logo{height:26px;display:block}
  .hq-tag{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--red);border:1px solid var(--red-line);border-radius:5px;padding:2px 6px;letter-spacing:.03em}
  .brand b{color:var(--red)}
  .hdr-r{display:flex;gap:8px;align-items:center}
  .pill{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--red-line);color:var(--red)}
  .ibtn{width:40px;height:40px;border-radius:10px;background:var(--elev);border:1px solid var(--line);font-size:15px;cursor:pointer;color:var(--dim)}

  .screen{position:fixed;left:0;right:0;margin:0 auto;max-width:760px;top:var(--top);bottom:var(--tab);
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 18px 28px}
  .tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:760px;z-index:20;display:flex;
    background:rgba(8,9,10,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;background:none;border:none;padding:11px 2px 9px;color:var(--faint);font-size:10.5px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .tab .ic{font-size:17px;line-height:1}
  .tab.on{color:var(--red)}
  .tab.on::before{content:'';position:absolute;top:0;left:50%;width:26px;height:2px;margin-left:-13px;background:var(--red);border-radius:0 0 2px 2px}
  .tab .n{position:absolute;top:5px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .stat{background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
  .stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;line-height:1}
  .stat span{font-size:11px;color:var(--dim)}
  .sec{font-size:12px;font-weight:600;color:var(--dim);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
  .sec::after{content:'';flex:1;height:1px;background:var(--line)}
  .empty{border:1px dashed var(--line2);border-radius:12px;padding:22px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.55}
  .lead-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .lead-h h2{font-size:24px}

  .card{background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
  .tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line2);color:var(--dim)}
  .tag.red{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
  .who{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ta,.inp,.sel{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;line-height:1.5;resize:vertical}
  .ta:focus,.inp:focus,.sel:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
  .inp,.sel{min-height:46px}
  .meta{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.55}
  .meta div{margin-bottom:5px}.meta b{color:var(--text);font-weight:600;margin-right:4px}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .row .btn{flex:1;min-width:110px}
  .btn{min-height:46px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--elev2);border:1px solid var(--line2);
    transition:transform .09s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(180deg,var(--red),var(--red-deep));border:none;color:#fff;box-shadow:0 6px 18px -8px rgba(232,48,42,.5)}
  .btn.ghost{background:transparent;color:var(--dim)}
  .btn.sm{min-height:38px;font-size:12.5px;padding:0 12px}
  .btn:disabled{opacity:.45}

  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chip{flex-shrink:0;padding:9px 13px;border-radius:20px;font-size:12px;font-weight:600;background:var(--elev);border:1px solid var(--line2);color:var(--dim);cursor:pointer;min-height:38px}
  .chip.on{border-color:var(--red);color:var(--text);background:var(--red-soft)}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--elev);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:56px}
  .item:active{background:var(--elev2)}
  .item .t{font-size:14px;font-weight:600}.item .s{font-size:11.5px;color:var(--dim);margin-top:2px}
  .item .r{color:var(--faint);font-size:18px}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--elev);border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .sh-head h3{font-size:21px}
  .x{width:38px;height:38px;border-radius:50%;background:var(--elev2);border:1px solid var(--line2);color:var(--dim);cursor:pointer;font-size:13px}
  .sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 24px}
  .fld{margin-bottom:13px}.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .help{font-size:11.5px;color:var(--dim);line-height:1.5;margin:-4px 0 12px}
  .modal-sub{font-size:11.5px;font-weight:600;color:var(--dim);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
  .xr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .xr:first-of-type{border-top:none}
  .xr small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .tg{width:38px;height:22px;border-radius:12px;background:var(--elev2);border:1px solid var(--line2);position:relative;flex-shrink:0;cursor:pointer}
  .tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
  .tg.on{background:var(--red);border-color:var(--red)}
  .tg.on::after{left:18px;background:#fff}
  .ex{display:grid;grid-template-columns:1fr 46px 46px 46px 40px;gap:5px;align-items:center;margin-bottom:6px}
  .ex .inp{padding:8px 4px;text-align:center;min-height:44px}.ex .inp.nm{text-align:left;padding:8px 10px}
  .ex-h{display:grid;grid-template-columns:1fr 46px 46px 46px 40px;gap:5px;font-size:10px;color:var(--faint);margin-bottom:4px;text-align:center}
  .ex-h span:first-child{text-align:left}
  .day{font-size:13px;font-weight:600;margin:14px 0 8px}

  .chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
  .b{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .b.me{align-self:flex-end;background:var(--red-soft);border:1px solid var(--red-line);border-bottom-right-radius:4px}
  .b.ai{align-self:flex-start;background:var(--elev);border:1px solid var(--line);border-bottom-left-radius:4px}
  .b .did{margin-top:8px;font-size:12px;color:var(--dim)}
  .askbar{position:fixed;left:0;right:0;margin:0 auto;max-width:760px;bottom:var(--tab);padding:10px 18px;display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:15}
  .askbar input{flex:1;min-width:0;background:var(--elev);border:1px solid var(--line2);border-radius:24px;padding:12px 16px;min-height:46px}
  .askbar input:focus{outline:none;border-color:var(--red)}
  .round{width:46px;height:46px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0}
  .round.mic{background:var(--elev2);border:1px solid var(--line2);color:var(--dim)}
  .round.mic.live{background:var(--red);color:#fff}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
  .gate-box{width:100%;max-width:400px}
  .gate h1{font-size:34px;margin-bottom:6px}.gate p{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0 0 18px}
  .code{background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:12px;line-height:1.5;word-break:break-all;margin:10px 0 14px;font-family:ui-monospace,Menlo,monospace}
  .err{color:var(--red);font-size:12.5px;min-height:18px;margin:8px 0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 74px);background:var(--elev2);border:1px solid var(--line2);border-left:3px solid var(--red);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--red);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>

<script>
(function(){
'use strict';

// ---------- config ----------
// Connection settings live in config.js (one small file at the top of your site), not in this file.
const CFG = window.REDLINE_CONFIG || {};
const SUPABASE_URL = String(CFG.supabaseUrl || '').trim();
const SUPABASE_KEY = String(CFG.supabaseKey || '').trim();
const DEMO = /[?&]demo\b/.test(location.search);
const CONFIGURED = SUPABASE_URL.indexOf('http') === 0 && SUPABASE_KEY.length > 20 && SUPABASE_KEY.indexOf('PASTE') !== 0;
const VAPID_PUBLIC_KEY = String(CFG.vapidPublicKey || 'PASTE_YOUR_VAPID_PUBLIC_KEY_HERE');   // see NOTIFICATIONS-SETUP.md

// ---------- tiny helpers ----------
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const dayKey = d => { d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = n => new Date(Date.now()+n*864e5).toISOString();
const ago = iso => { if(!iso) return 'never'; const d=Math.floor((Date.now()-new Date(iso))/864e5); return d<=0?'today':d===1?'yesterday':d+' days ago'; };

let sb=null, ME=null, S={}, Q=[], L=[], C=[], TAB='today', ASKLOG=[], IS_OWNER=false;
let STAFF=[], MSGS=[], MYACCESS={}, MYPERMS={}, MYNOTIF={prefs:{},quiet_start:'22:00',quiet_end:'06:30'}, VAPID_PUBLIC='';

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); return true; }
}
function sheet(title, html, mount){
  $('#sheetHost').innerHTML = `<div class="ov" id="ov"><div class="sheet"><div class="sh-head"><h3>${esc(title)}</h3><button class="x" id="shX" aria-label="Close">✕</button></div><div class="sh-body" id="shBody">${html}</div></div></div>`;
  $('#shX').onclick = closeSheet;
  $('#ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeSheet(); });
  if(mount) mount($('#shBody'));
}
function closeSheet(){ $('#sheetHost').innerHTML=''; }

// ---------- data layer: Supabase, or a local demo store ----------
const LS='hq-demo:';
const rd = t => JSON.parse(localStorage.getItem(LS+t)||'[]');
const wr = (t,a) => localStorage.setItem(LS+t, JSON.stringify(a));
const db = {
  async list(t){
    if(DEMO) return rd(t);
    const { data, error } = await sb.from(t).select('*').order('created_at',{ascending:false});
    if(error) throw error; return data||[];
  },
  async insert(t, rows){
    rows = Array.isArray(rows)?rows:[rows];
    if(DEMO){ const out=rows.map(r=>Object.assign({id:uid(),created_at:new Date().toISOString()},r)); wr(t,out.concat(rd(t))); return out; }
    const { data, error } = await sb.from(t).insert(rows).select(); if(error) throw error; return data;
  },
  async update(t, key, id, patch){
    if(DEMO){ wr(t, rd(t).map(r=>r[key]===id?Object.assign({},r,patch):r)); return; }
    const { error } = await sb.from(t).update(patch).eq(key,id); if(error) throw error;
  },
  async remove(t, key, id){
    if(DEMO){ wr(t, rd(t).filter(r=>r[key]!==id)); return; }
    const { error } = await sb.from(t).delete().eq(key,id); if(error) throw error;
  },
  async kvGet(userId, key){
    if(DEMO){ const v=localStorage.getItem(LS+'kv:'+userId+':'+key); return v?JSON.parse(v):null; }
    const { data } = await sb.from('app_data').select('value').eq('user_id',userId).eq('key',key).maybeSingle();

    const { error } = await sb.from('app_data').upsert([{ user_id:userId, key, value:JSON.stringify(val), updated_at:new Date().toISOString() }],{ onConflict:'user_id,key' });
    if(error) throw error;
  },
  async signups(){
    if(DEMO) return [{id:'demo-client-2',email:'sam@example.com',created_at:new Date().toISOString()}];
    const { data, error } = await sb.rpc('signups'); if(error) throw error; return data||[];
  },
  async listByEq(t, col, val){
    if(DEMO) return rd(t).filter(r=>r[col]===val);
    const { data, error } = await sb.from(t).select('*').eq(col,val).order('created_at',{ascending:true});
    if(error) throw error; return data||[];
  },
  async upsert(t, rows, onConflict){
    rows = Array.isArray(rows)?rows:[rows];
    if(DEMO){
      const existing = rd(t);
      rows.forEach(row=>{
        const keys = (onConflict||'').split(',').filter(Boolean);
        const idx = keys.length ? existing.findIndex(e=>keys.every(k=>e[k]===row[k])) : -1;
        if(idx>-1) existing[idx] = Object.assign({}, existing[idx], row);
        else existing.unshift(Object.assign({id:uid(),created_at:new Date().toISOString()}, row));
      });
      wr(t, existing);
      return rows;
    }
    const { data, error } = await sb.from(t).upsert(rows, onConflict?{onConflict}:{}).select();
    if(error) throw error; return data;
  }
};

// Calls the 'team' edge function, which is the only place allowed to create
// real logins and send invite emails (needs the service-role key, so it can
// never run in the browser).
async function callTeamFn(action, payload){
  if(DEMO){
    // simulate locally so the demo is fully click-through without a server
    if(action==='invite'){
      const id='staff-'+uid();
      const row={ user_id:id, email:payload.email, name:payload.name||'', status:'active', created_at:new Date().toISOString() };
      wr('staff',[row].concat(rd('staff')));
      const areas=['overview','inbox','clients','leads','instagram','approvals','reports','settings'];
      wr('team_access', areas.map(a=>({user_id:id,area:a,level:'none'})).concat(rd('team_access')));
      wr('team_perms', [{user_id:id,see_revenue:false,approve_sends:false,see_health:false,export_data:false}].concat(rd('team_perms')));
      return { ok:true, user_id:id };
    }
    if(action==='suspend'||action==='reactivate'){
      wr('staff', rd('staff').map(x=>x.user_id===payload.user_id?Object.assign({},x,{status:action==='suspend'?'suspended':'active'}):x));
      return { ok:true };
    }
    if(action==='remove'){
      wr('staff', rd('staff').filter(x=>x.user_id!==payload.user_id));
      wr('team_access', rd('team_access').filter(x=>x.user_id!==payload.user_id));
      wr('team_perms', rd('team_perms').filter(x=>x.user_id!==payload.user_id));
      return { ok:true };
    }
    return { ok:true };
  }
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if(!token) throw new Error('Signed out. Log in again.');
  const r = await fetch(SUPABASE_URL+'/functions/v1/team', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify(Object.assign({action}, payload))
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok||d.error) throw new Error(d.error||('Request failed ('+r.status+')'));
  return d;
}

function parseJSON(t){
  if(!t) return null;
  try{ return JSON.parse(t.trim()); }catch(e){}
  const f=t.match(/```json([\s\S]*?)```/i)||t.match(/```([\s\S]*?)```/); const raw=f?f[1]:t;
  try{ return JSON.parse(raw.trim()); }catch(e){}
  const a=Math.min(...['{','['].map(c=>{const i=raw.indexOf(c);return i<0?1e9:i;})); const bC=raw.lastIndexOf('}'), bB=raw.lastIndexOf(']'); const b=Math.max(bC,bB);
  if(a<1e9&&b>a){ try{ return JSON.parse(raw.slice(a,b+1)); }catch(e){} }
  return null;
}
async function ai(prompt, max){
  if(window.__mockAI) return window.__mockAI(prompt);
  if(DEMO) throw new Error('AI is off in demo mode. Connect Supabase to turn it on.');
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if(!token) throw new Error('Signed out. Log in again.');
  const r = await fetch(SUPABASE_URL+'/functions/v1/scan', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({ contents:[{role:'user',parts:[{text:prompt}]}], system:bizContext(), maxTokens:max||6000, json:true })
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok||d.error) throw new Error(d.error||('AI request failed ('+r.status+')'));
  return d.text||'';
}
async function aiJSON(prompt, max){
  const txt = await ai(prompt, max); const j = parseJSON(txt);
  if(!j) throw new Error('The AI reply could not be read. Try again.');
  return j;
}
async function working(btn, label, fn){
  const orig = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spin"></span>'+label; }
  try{ return await fn(); }
  catch(e){ toast(e.message||'Something went wrong'); console.error(e); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=orig; } }
}

async function draftDMs(mode){
  const open = new Set(Q.filter(q=>q.kind==='dm'&&(q.status==='draft'||q.status==='approved')).map(q=>q.lead_id));
  let t = mode==='first'
    ? L.filter(l=>l.stage==='new')
    : L.filter(l=>l.stage==='contacted' && (!l.next_touch || new Date(l.next_touch)<=new Date()));
  t = t.filter(l=>!open.has(l.id));
  const room = cap() - sentToday() - open.size;
  if(room<=0){ toast('Daily message cap reached. Raise it in Settings if you want more.'); return 0; }
  t = t.slice(0, Math.min(10, room));
  if(!t.length){ toast(mode==='first'?'No new leads waiting.':'No follow-ups due.'); return 0; }
  const people = t.map(l=>({id:l.id, handle:l.handle, name:l.name||'', notes:l.notes||'', daysSinceLastMessage: l.last_touch?Math.floor((Date.now()-new Date(l.last_touch))/864e5):null}));
  const j = await aiJSON(
    (mode==='first'
      ? 'Write a first Instagram DM to each person below. Max 55 words each. Friendly, specific to what the notes say if anything, one easy question, no pitch, no link, no emoji spam (one at most). Make each different.'
      : 'Write a short follow-up DM to each person below who has not replied to the first message. Max 40 words. Light, no guilt, no "just checking in" cliches, give them an easy way to say no thanks.')
    + '\nPeople: ' + JSON.stringify(people) + '\nReturn JSON only: {"dms":[{"id":"<same id>","text":"<message>"}]}', 4000);
  const rows = (j.dms||[]).filter(d=>d&&d.id&&d.text&&leadOf(d.id)).map(d=>({
    kind:'dm', title: mode==='first'?'First message':'Follow-up', body:String(d.text).trim(), lead_id:d.id, status:'draft', meta:{step:mode}
  }));
  if(!rows.length) throw new Error('No usable drafts came back. Try again.');
  Q = (await db.insert('queue', rows)).concat(Q);
  await notify(ME.id, 'approval_needed', 'Messages ready to approve', rows.length+' '+(mode==='first'?'new message':'follow-up')+(rows.length===1?'':'s')+' drafted.', '');
  return rows.length;
}

async function addLeads(raw){
  const have = new Set(L.map(l=>l.handle.toLowerCase()));

  String(raw).split(/\n|,/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m = line.match(/^@?([A-Za-z0-9._]{1,30})(?:\s*[-:|]\s*(.+))?$/); if(!m) return;

// Keywords that hold a message for the coach instead of letting the AI answer.
// Deliberately broad — a false positive just means the coach sees a normal
// message a bit sooner, which is a far smaller cost than a missed one.
const RISK_WORDS = /\b(pain|hurt|injur|sore(?!ness)|sprain|strain|numb|dizzy|chest|breath|faint|bleed|sick|ill|fever|medicat|pregnan|period|cancel|refund|charge|billing|price|cost|quit|anxious|depress|binge|purge|overwhelm|can.t cope|suicid|self.harm)\b/i;

function conversationsFromMessages(){
  const byKey = new Map();
  MSGS.forEach(m=>{
    const key = m.client_id || m.lead_id;
    if(!byKey.has(key)) byKey.set(key, []);
    byKey.get(key).push(m);
  });
  const convos = [];
  byKey.forEach((msgs, key)=>{
    msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    const last = msgs[msgs.length-1];
    const c = C.find(x=>x.user_id===key);
    const l = L.find(x=>x.id===key);
    convos.push({
      key, msgs, last,
      name: c ? (c.display_name||c.email) : (l ? '@'+l.handle : 'Unknown'),
      source: last.source,
      client_id: c ? c.user_id : null,
      lead_id: l ? l.id : null,
      flagged: msgs.some(m=>m.flagged && !msgs.some(x=>x.direction==='out' && new Date(x.created_at)>new Date(m.created_at))),
      needsReply: last.direction==='in'
    });
  });
  convos.sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
  return convos;
}

// Classifies an incoming message, then either answers it instantly (app
// questions), holds it for the coach (anything risky), or drafts a reply
// into the approval queue (everything else).
async function handleIncomingMessage(msg){
  if(RISK_WORDS.test(msg.body)){
    await db.update('messages','id',msg.id,{ flagged:'This mentions something that needs a personal reply — health, pain, billing or similar.' });
    MSGS = await db.list('messages');
    await notify(ME.id, 'risky_message_flagged', 'Needs your reply', (msg.client_id?'A client':'A lead')+' message was held for you.', '');
    return;
  }
  try{
    const j = await aiJSON(
      'A message just came in: "'+msg.body+'"\nIs this a question about how the Redline app works (logging food, using the training tab, scanning, settings, navigation)? If yes, answer it directly and helpfully in under 60 words, and set appQuestion to true. If no (anything about their actual training, nutrition advice, or a personal matter), write a short draft reply a coach could send, and set appQuestion to false.\nReturn JSON only: {"appQuestion":true|false,"reply":""}', 600);
    if(j.appQuestion && j.reply){
      await db.insert('messages',[{ client_id:msg.client_id, lead_id:msg.lead_id, source:msg.source, direction:'out', author:'ai', body:j.reply }]);
      MSGS = await db.list('messages');
    } else if(j.reply){
      Q = (await db.insert('queue',[{ kind:'reminder', title:'Inbox reply', body:j.reply, client_id:msg.client_id, lead_id:msg.lead_id, status:'draft', meta:{inbox:true} }])).concat(Q);
      await notify(ME.id, 'new_client_message', 'New message', (msg.client_id?'A client':'A lead')+' sent a message — reply drafted.', '');
    }
  }catch(e){ console.error('inbox classify failed', e); }
  setBadge();
}

function b64ToUint8(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const raw = atob((base64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}

async function pushStatus(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  if(Notification.permission === 'denied') return 'denied';
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return sub ? 'on' : 'off';
  }catch(e){ return 'off'; }
}

async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){ toast('Push is not supported in this browser.'); return false; }
  if(VAPID_PUBLIC_KEY.indexOf('PASTE') === 0){ toast('Push keys are not set up yet — see NOTIFICATIONS-SETUP.md.'); return false; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast('Notifications were not allowed.'); return false; }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToUint8(VAPID_PUBLIC_KEY) });
  }
  const j = sub.toJSON();
  if(DEMO){ toast('Push enabled (demo — nothing is actually sent).'); return true; }
  await db.upsert('push_subs', [{ user_id:ME.id, endpoint:j.endpoint, keys:j.keys }], 'endpoint');
  toast('Notifications enabled on this device.');
  return true;
}

// ---------- Ask HQ (command agent) ----------
async function ask(cmd){
  ASKLOG.push({r:'me',t:cmd}); renderAsk();
  const state = { leads:L.length, newLeads:L.filter(l=>l.stage==='new').length, contacted:L.filter(l=>l.stage==='contacted').length, calls:L.filter(l=>l.stage==='call').length, clients:C.length, toApprove:pending().length, sentToday:sentToday(), dailyCap:cap() };
  const j = await aiJSON(
    'The owner gave HQ this command: "'+cmd+'"\nCurrent state: '+JSON.stringify(state)+'\n'
    + 'You can only do these actions: add_leads {"handles":["..."]}, draft_first_dms {}, draft_followups {}, plan_week {}, content_idea {"topic":"..."}. For anything else (reporting, advice, questions) just answer in "reply" with no actions. Never claim to have sent or posted anything: everything is drafted for approval. Keep reply under 60 words.\n'
    + 'Return JSON only: {"reply":"","actions":[{"type":"","handles":[],"topic":""}]}', 2000);
  const did=[];
  for(const a of (j.actions||[])){
    try{
      if(a.type==='add_leads'){ const n=await addLeads((a.handles||[]).join('\n')); did.push(n+' lead'+(n===1?'':'s')+' added'); }
      else if(a.type==='draft_first_dms'){ const n=await draftDMs('first'); did.push(n+' first message'+(n===1?'':'s')+' drafted'); }
      else if(a.type==='draft_followups'){ const n=await draftDMs('follow'); did.push(n+' follow-up'+(n===1?'':'s')+' drafted'); }
      else if(a.type==='plan_week'){ const n=await planWeek(); did.push(n+' content ideas drafted'); }
      else if(a.type==='content_idea'&&a.topic){ await oneIdea(a.topic); did.push('1 reel drafted'); }
    }catch(e){ did.push('Could not finish: '+e.message); }
  }
  const replyText = j.reply || 'Done.';
  const didText = did.length ? did.join(' · ')+(did.some(x=>/drafted/.test(x))?'. Review on Today.':'') : '';
  ASKLOG.push({r:'ai',t:replyText,did:didText});
  renderAsk(); setBadge();
  speakReply(replyText + (didText ? '. ' + didText : ''));
}

// ---------- voice talk-back ----------
let voiceOn = true;   // read AI replies aloud automatically; off = silent
function speakReply(text){
  if(!voiceOn || !('speechSynthesis' in window) || !text) return;
  try{
    window.speechSynthesis.cancel();   // don't queue up if a reply arrives mid-speech
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech synthesis not available — fail silently, text is still shown */ }
}
let SR=null, rec=null;
function setupVoice(){
  SR = window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  $('#micBtn').classList.remove('hidden');
  $('#micBtn').onclick = ()=>{
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang='en-AU'; rec.interimResults=false; rec.maxAlternatives=1;
    $('#micBtn').classList.add('live');
    rec.onresult = e=>{ $('#askInput').value = e.results[0][0].transcript; sendAsk(); };
    rec.onend = ()=>{ rec=null; $('#micBtn').classList.remove('live'); };
    rec.onerror = ()=>{ rec=null; $('#micBtn').classList.remove('live'); toast('Could not hear that. Try typing.'); };
    try{ rec.start(); }catch(e){ rec=null; $('#micBtn').classList.remove('live'); }
  };
}
let asking=false;
async function sendAsk(){
  const inp=$('#askInput'), t=inp.value.trim(); if(!t||asking) return;
  asking=true; inp.value='';
  try{ await ask(t); }catch(e){ ASKLOG.push({r:'ai',t:'That did not work: '+(e.message||'unknown error')}); renderAsk(); }
  asking=false;
}

document.addEventListener('click', async e=>{
  const t = e.target.closest('button,[data-lead],[data-client],[data-quick],[data-convo],[data-member]'); if(!t) return;
  if(t.dataset.act){
    const q = Q.find(x=>x.id===t.dataset.id); if(!q) return;
    const bodyEl = document.querySelector('[data-body="'+q.id+'"]'); if(bodyEl && bodyEl.value!==q.body) await setQ(q,{body:bodyEl.value});
    if(t.dataset.act==='approve'){ await setQ(q,{status:'approved'}); toast('Approved'); }
    else if(t.dataset.act==='reject'){ await setQ(q,{status:'rejected'}); }
    else if(t.dataset.act==='copy'){ await copy(composeCopy(q)); toast('Copied'); return; }
    else if(t.dataset.act==='ig'){ const l=leadOf(q.lead_id); await copy(q.body); window.open('https://ig.me/m/'+encodeURIComponent(l.handle),'_blank'); toast('Message copied. Paste it into the chat.'); return; }
    else if(t.dataset.act==='done'){
      await setQ(q,{status:'done',sent_at:new Date().toISOString()});
      const l=leadOf(q.lead_id); if(l && q.kind==='dm') await setLead(l,{stage:l.stage==='new'?'contacted':l.stage,last_touch:new Date().toISOString(),next_touch:addDays(3)});
      // any approved message tied to a client/lead also lands in the Inbox thread as sent
      if(q.client_id || q.lead_id){
        await db.insert('messages',[{ client_id:q.client_id||null, lead_id:q.lead_id||null, source:q.client_id?'app':'instagram', direction:'out', author:'coach', body:q.body }]);
        MSGS = await db.list('messages');
        if(q.client_id) await notify(q.client_id, 'coach_replied', 'Your coach replied', q.body.slice(0,80), '');
      }
      toast(q.kind==='dm'?'Logged. Follow-up due in 3 days.':'Done');
    }
    render(); return;
  }
  if(t.dataset.lead){ const l=leadOf(t.dataset.lead); if(l) leadSheet(l); return; }
  if(t.dataset.client){ const c=clientOf(t.dataset.client); if(c) clientSheet(c); return; }
  if(t.dataset.convo){ conversationThreadSheet(t.dataset.convo); return; }
  if(t.dataset.member){ memberSheet(t.dataset.member); return; }
  if(t.dataset.quick){ $('#askInput').value=t.dataset.quick; sendAsk(); return; }
  if(t.dataset.f && t.classList.contains('chip')){ renderLeads(t.dataset.f); return; }
  if(t.id==='addLeadsBtn') return addLeadsSheet();
  if(t.id==='addClientBtn') return addClientSheet();
  if(t.id==='dmFirst') return working(t,'Drafting...',async()=>{ const n=await draftDMs('first'); if(n){ toast(n+' drafted. Approve them on Today.'); go('today'); } });
  if(t.id==='dmFollow') return working(t,'Drafting...',async()=>{ const n=await draftDMs('follow'); if(n){ toast(n+' drafted. Approve them on Today.'); go('today'); } });
  if(t.id==='planWeekBtn') return working(t,'Planning...',async()=>{ const n=await planWeek(); toast(n+' ideas drafted.'); renderContent(); setBadge(); });
  if(t.id==='ideaBtn'){ sheet('One reel idea',`<div class="fld"><label>What is it about?</label><input class="inp" id="ideaTopic" placeholder="e.g. why most people stall on bench"></div><button class="btn pri" id="ideaGo" style="width:100%">Draft it</button>`,b=>{
      $('#ideaGo',b).onclick=()=>working($('#ideaGo',b),'Drafting...',async()=>{ const tp=$('#ideaTopic',b).value.trim(); if(!tp){ toast('Add a topic'); return; } await oneIdea(tp); closeSheet(); renderContent(); setBadge(); toast('Drafted'); }); }); return; }
  if(t.id==='askSend') return sendAsk();
  if(t.id==='btnSettings') return settingsSheet();
  if(t.classList.contains('tab')) return go(t.dataset.tab);
});

    <div class="fld"><label>Email</label><input class="inp" id="gEmail" type="email" autocomplete="email" autocapitalize="none"></div>
    <div class="fld"><label>Password</label><input class="inp" id="gPass" type="password" autocomplete="current-password" enterkeyhint="go"></div>
    <div class="err" id="gErr">${esc(msg||'')}</div><button class="btn pri" id="gGo" style="width:100%">Sign in</button>`);
  const go=async()=>{ const { data, error } = await sb.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value}); if(error){ $('#gErr').textContent=error.message; return; } ME=data.user; checkAdmin(); };
  $('#gGo').onclick=go; $('#gPass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
async function checkAdmin(){
  // HQ accepts two kinds of account: the owner (admins table) and any staff
  // member they've invited (staff table, must be active). A client account —
  // someone only in the `clients` table from the phone app — is never let in.
  const [adminRow, staffRow] = await Promise.all([
    sb.from('admins').select('user_id').eq('user_id',ME.id).maybeSingle(),
    sb.from('staff').select('user_id,status').eq('user_id',ME.id).maybeSingle(),
  ]);
  if(adminRow.error && staffRow.error) return showGate(`<h1>Almost there</h1><p>Run <b>schema.sql</b> in your Supabase SQL Editor first, then reload.</p><div class="code">${esc(adminRow.error.message)}</div>`);

  IS_OWNER = !!adminRow.data;
  if(IS_OWNER){ start(); return; }

  if(staffRow.data){
    if(staffRow.data.status === 'suspended'){
      return showGate(`<h1>Access suspended</h1><p>Your Redline HQ access has been turned off. Contact the owner if this is unexpected.</p><button class="btn" id="gOut" style="width:100%">Sign out</button>`), $('#gOut').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
    }
    start();
    return;
  }

  return showGate(`<h1>Not on the team yet</h1><p>You are signed in as <b>${esc(ME.email)}</b>, but this account has no Redline HQ access. Ask the owner to invite you from Settings → Team.</p><button class="btn" id="gOut" style="width:100%">Sign out</button>`), $('#gOut').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
}
boot();
window.__hq = { get Q(){return Q;}, get L(){return L;}, get C(){return C;}, db, handleIncomingMessage };
})();
</script>
